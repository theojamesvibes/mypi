{% extends "base.html" %}
{% block title %}Query Log{% endblock %}

{% block content %}
<div class="container-fluid px-3 py-3">

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="fw-semibold mb-0"><i class="bi bi-list-ul me-2 text-primary"></i>Query Log<span class="page-title-site"></span></h5>
    <div class="d-flex gap-2 align-items-center">
      <div class="form-check form-switch mb-0 d-flex align-items-center gap-2" title="Refresh every 2 seconds">
        <input class="form-check-input" type="checkbox" id="live-toggle">
        <label class="form-check-label small" for="live-toggle">
          <i class="bi bi-broadcast text-danger" id="live-icon" style="display:none;"></i> Live
        </label>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="refresh-btn">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-end">
        <div class="col-sm-3">
          <label class="form-label form-label-sm mb-1">Instance</label>
          <select id="f-instance" class="form-select form-select-sm">
            <option value="">All instances</option>
          </select>
        </div>
        <div class="col-sm-3">
          <label class="form-label form-label-sm mb-1">Domain</label>
          <input type="text" id="f-domain" class="form-control form-control-sm" placeholder="e.g. ads.example.com">
        </div>
        <div class="col-sm-2">
          <label class="form-label form-label-sm mb-1">Client</label>
          <input type="text" id="f-client" class="form-control form-control-sm" placeholder="IP or name">
        </div>
        <div class="col-sm-2">
          <label class="form-label form-label-sm mb-1">Show</label>
          <select id="f-blocked" class="form-select form-select-sm">
            <option value="">All queries</option>
            <option value="true">Blocked only</option>
            <option value="false">Permitted only</option>
            <option value="clients">Unique Clients</option>
          </select>
        </div>
        <div class="col-sm-2">
          <label class="form-label form-label-sm mb-1">Time range</label>
          <select id="f-hours" class="form-select form-select-sm">
            <option value="24">Last 24h</option>
            <option value="48">Last 48h</option>
            <option value="168">Last 7 days</option>
            <option value="720">Last 30 days</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span id="query-count" class="small text-muted">Loading…</span>
      <div id="pagination-top" class="d-flex gap-1"></div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-hover mb-0 query-log-table">
          <thead class="table-light" id="queries-thead-default">
            <tr>
              <th class="sort-col" data-col="timestamp">Time <span class="sort-icon" id="sort-timestamp">↓</span></th>
              <th>Instance</th>
              <th class="sort-col" data-col="domain">Domain <span class="sort-icon" id="sort-domain"></span></th>
              <th class="sort-col" data-col="query_type">Type <span class="sort-icon" id="sort-query_type"></span></th>
              <th class="sort-col" data-col="client">Client <span class="sort-icon" id="sort-client"></span></th>
              <th class="sort-col" data-col="status">Status <span class="sort-icon" id="sort-status"></span></th>
              <th class="text-end sort-col" data-col="reply_time_ms">Reply (ms) <span class="sort-icon" id="sort-reply_time_ms"></span></th>
              <th></th>
            </tr>
          </thead>
          <thead class="table-light d-none" id="queries-thead-clients">
            <tr>
              <th>Client</th>
              <th class="text-end">Queries</th>
              <th class="text-end">Blocked</th>
              <th class="text-end">% Blocked</th>
              <th>Last Seen</th>
            </tr>
          </thead>
          <tbody id="queries-tbody">
            <tr><td colspan="8" class="text-center text-muted py-4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-end">
      <div id="pagination-bottom" class="d-flex gap-1"></div>
    </div>
  </div>
</div>

<!-- Domain management modal -->
<div class="modal fade" id="domainModal" tabindex="-1" aria-labelledby="domainModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="domainModalLabel">
          <i class="bi bi-shield me-2 text-primary"></i>Manage Domain
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-3 fw-semibold text-truncate" id="domain-modal-title"></p>
        <div id="domain-modal-body"></div>
      </div>
      <div class="modal-footer" id="domain-modal-footer"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/queries.js"></script>
{% endblock %}
