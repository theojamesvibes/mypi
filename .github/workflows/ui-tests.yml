name: ui-tests

# Browser-driven Playwright suite. Runs against a live uvicorn process
# backed by a real Postgres service container — same engine + driver as
# prod. Kept in its own workflow so the fast pytest suite (.github/
# workflows/test.yml) doesn't have to wait on Chromium downloads.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mypi_uitest
          POSTGRES_USER: mypi
          POSTGRES_PASSWORD: ui-test-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mypi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Async DSN used by the running app; the conftest swaps the driver
      # to psycopg for the alembic migration step.
      DATABASE_URL: postgresql+asyncpg://mypi:ui-test-pw@localhost:5432/mypi_uitest
      SECRET_KEY: ui-test-secret-key-not-for-production
      # Skip the testcontainer Postgres that tests/conftest.py would
      # otherwise spin up — we already have a service container.
      MYPI_SKIP_TESTCONTAINER: "1"

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Chromium only — Firefox/WebKit add ~5 min to the workflow without
      # catching anything our app is likely to break.
      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright UI suite
        run: pytest tests/playwright -m playwright -v --tracing=retain-on-failure

      # On failure, upload the uvicorn log + Playwright trace bundles so
      # failures are diagnosable from the Actions UI without having to
      # re-run locally.
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          path: |
            playwright-app.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
