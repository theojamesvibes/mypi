<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPi — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card shadow">
      <div class="login-header">
        <i class="bi bi-shield-fill-check text-success auth-icon"></i>
        <h2 class="mt-2 mb-0">My<strong>Pi</strong></h2>
        <p class="text-muted small">Consolidated Pi-hole Dashboard</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 px-3 small mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error | e }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" autofocus autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
