name: ui-tests

# Browser-driven Playwright suites. Runs against a live uvicorn process
# backed by a real Postgres service container — same engine + driver as
# prod. Kept in its own workflow so the fast pytest suite (.github/
# workflows/test.yml) doesn't have to wait on Chromium downloads.
#
# Two parallel jobs:
#   playwright            — seeded-DB tests (deterministic, fastest)
#   playwright-collector  — emulator-driven E2E tests (real polling
#                           through the Pi-hole v6 emulator subprocess)

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mypi_uitest
          POSTGRES_USER: mypi
          POSTGRES_PASSWORD: ui-test-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mypi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Async DSN used by the running app; the conftest swaps the driver
      # to psycopg for the alembic migration step.
      DATABASE_URL: postgresql+asyncpg://mypi:ui-test-pw@localhost:5432/mypi_uitest
      SECRET_KEY: ui-test-secret-key-not-for-production
      # Skip the testcontainer Postgres that tests/conftest.py would
      # otherwise spin up — we already have a service container.
      MYPI_SKIP_TESTCONTAINER: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Chromium only — Firefox/WebKit add ~5 min to the workflow without
      # catching anything our app is likely to break.
      #
      # No --with-deps because the GH-hosted ubuntu runner already has
      # Chromium's system dependencies pre-installed; --with-deps runs
      # apt-get under the hood which has been intermittently hanging
      # for 10+ min on specific runner instances. Without it the install
      # is just a 150 MB browser binary download (~5–15 s).
      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run Playwright UI suite
        run: pytest tests/playwright -m playwright -v --tracing=retain-on-failure

      # On failure, upload the uvicorn log + Playwright trace bundles so
      # failures are diagnosable from the Actions UI without having to
      # re-run locally.
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-diagnostics
          path: |
            playwright-app.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-collector:
    # Emulator-driven E2E suite. A small Pi-hole v6 emulator
    # (tests/emulators/pihole/app.py) runs as a subprocess on
    # 127.0.0.1:9876; the MyPi app subprocess polls it on a short
    # cadence and the tests assert that real polled data lands on
    # the dashboard.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mypi_collector_uitest
          POSTGRES_USER: mypi
          POSTGRES_PASSWORD: ui-test-pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mypi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://mypi:ui-test-pw@localhost:5433/mypi_collector_uitest
      SECRET_KEY: collector-test-secret-key-not-for-production
      MYPI_SKIP_TESTCONTAINER: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright collector E2E suite
        run: pytest tests/playwright_collector -m playwright -v --tracing=retain-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-collector-diagnostics
          path: |
            playwright-collector-app.log
            playwright-emulator.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  playwright-sync:
    # Master→replica sync E2E suite. Two emulator subprocesses
    # (9876 master, 9877 replica) plus the MyPi app; tests trigger a
    # sync via the UI and assert the teleporter ZIP landed on the
    # replica.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mypi_sync_uitest
          POSTGRES_USER: mypi
          POSTGRES_PASSWORD: ui-test-pw
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U mypi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://mypi:ui-test-pw@localhost:5434/mypi_sync_uitest
      SECRET_KEY: sync-test-secret-key-not-for-production
      MYPI_SKIP_TESTCONTAINER: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright sync E2E suite
        run: pytest tests/playwright_sync -m playwright -v --tracing=retain-on-failure

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-sync-diagnostics
          path: |
            playwright-sync-app.log
            playwright-sync-master.log
            playwright-sync-replica.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
