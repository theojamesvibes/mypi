services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mypi}
      POSTGRES_USER: ${POSTGRES_USER:-mypi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mypi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    networks:
      - default
      - proxy
    volumes:
      - ./pihole_instances.yml:/app/pihole_instances.yml:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mypi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mypi}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}
      PIHOLE_CONFIG_PATH: /app/pihole_instances.yml
      STATS_POLL_INTERVAL: ${STATS_POLL_INTERVAL:-60}
      QUERIES_POLL_INTERVAL: ${QUERIES_POLL_INTERVAL:-10}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mypi.entrypoints=websecure"
      - "traefik.http.routers.mypi.rule=Host(`mypi.myssdomain.net`)"
      - "traefik.http.routers.mypi.tls=true"
      - "traefik.http.routers.mypi.tls.certresolver=cloudflare"
      - "traefik.http.services.mypi.loadbalancer.server.port=8080"

volumes:
  pgdata:

networks:
  proxy:
    external: true
