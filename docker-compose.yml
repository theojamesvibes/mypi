services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    stop_grace_period: 60s   # allow Postgres to flush WAL and checkpoint cleanly
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mypi}
      POSTGRES_USER: ${POSTGRES_USER:-mypi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mypi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/theojamesvibes/mypi:latest
    container_name: mypi
    restart: unless-stopped
    stop_grace_period: 30s   # allow in-flight requests and background jobs to finish
    volumes:
      - ./pihole_instances.yml:/app/pihole_instances.yml:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mypi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mypi}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      # Leave unset/empty to have MyPi generate a random admin password on
      # first boot and log it once; set INITIAL_ADMIN_PASSWORD in .env to pin one.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PIHOLE_CONFIG_PATH: /app/pihole_instances.yml
      STATS_POLL_INTERVAL: ${STATS_POLL_INTERVAL:-60}
      QUERIES_POLL_INTERVAL: ${QUERIES_POLL_INTERVAL:-10}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

    # ── Optional: Traefik reverse-proxy ────────────────────────────────────────
    # Remove the `ports` block above, add `proxy` to networks below, and
    # uncomment these labels (set MYPI_HOST in your .env):
    #
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.mypi.entrypoints=websecure"
    #   - "traefik.http.routers.mypi.rule=Host(`${MYPI_HOST}`)"
    #   - "traefik.http.routers.mypi.tls=true"
    #   - "traefik.http.routers.mypi.tls.certresolver=cloudflare"
    #   - "traefik.http.services.mypi.loadbalancer.server.port=8080"

volumes:
  pgdata:

# networks:             # uncomment if using Traefik
#   proxy:
#     external: true
