<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPi — Change Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card shadow">
      <div class="login-header">
        <i class="bi bi-shield-lock-fill text-warning auth-icon"></i>
        <h2 class="mt-2 mb-0">Change Password</h2>
        <p class="text-muted small">You must set a new password before continuing.</p>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 px-3 small mb-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error | e }}
      </div>
      {% endif %}
      <form method="post" action="/change-password">
        <div class="mb-3">
          <label class="form-label" for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" class="form-control" autocomplete="current-password" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" class="form-control" autocomplete="new-password" minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-warning w-100 text-dark fw-semibold">
          <i class="bi bi-check-lg me-1"></i>Set New Password
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
