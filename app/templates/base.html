<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyPi{% endblock %} — Pi-hole Dashboard</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom -->
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <i class="bi bi-shield-fill-check text-success"></i>
      <span>My<strong>Pi</strong></span>
    </div>
    <div class="sidebar-subtitle">Multi-hole Dashboard</div>
  </div>
  <ul class="sidebar-nav">
    <li class="nav-item {% if request.url.path == '/' %}active{% endif %}">
      <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
    </li>
    <li class="nav-item {% if request.url.path == '/queries' %}active{% endif %}">
      <a href="/queries"><i class="bi bi-list-ul"></i> Query Log</a>
    </li>
    <li class="nav-item {% if request.url.path == '/settings' %}active{% endif %}">
      <a href="/settings"><i class="bi bi-gear"></i> Settings</a>
    </li>
    <li class="nav-item">
      <a href="/docs" target="_blank"><i class="bi bi-code-slash"></i> API Docs</a>
    </li>
  </ul>
  <div class="sidebar-footer">
    <a href="/logout" class="btn btn-sm btn-outline-secondary w-100">
      <i class="bi bi-box-arrow-right"></i> Logout ({{ user.username }})
    </a>
  </div>
</nav>

<!-- Main content -->
<div id="main-content">
  <div class="topbar d-flex align-items-center justify-content-between px-3 py-2">
    <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-list"></i>
    </button>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-success" id="online-count">— online</span>
      <span class="text-muted small" id="last-updated"></span>
    </div>
  </div>

  <div class="content-wrapper">
    {% block content %}{% endblock %}
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- App JS -->
<script src="/static/js/dashboard.js"></script>
{% block extra_js %}{% endblock %}

<script>
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('main-content').classList.toggle('expanded');
  });
</script>
</body>
</html>
